name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('teslawbc.yaml') }}
      - run: pip install esphome==2026.10.2
      - run: cp secrets.yaml.example secrets.yaml
      - run: esphome config teslawbc.yaml
      - run: esphome compile teslawbc.yaml
