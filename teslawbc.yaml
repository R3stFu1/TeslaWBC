# =============================================================================
# TeslaWBC: local current control for a Tesla Wall Connector Gen 3
#
# Hardware: Olimex ESP32-POE-ISO-16MB-IND on PoE LAN, two Waveshare
# TTL TO RS485 (B) modules (automatic direction control, no DE/RE pin).
#   Bus 1 (meter):   ESP32 is Modbus master to a Crompton DRS-100-3P MOD
#                    that measures only the wallbox feed.
#   Bus 2 (charger): ESP32 poses as the Neurio meter the Wall Connector polls.
#
# Aperta sets the mode (Bypass, Manual, Pause) and the target current over
# MQTT or REST (see README.md). The logic lives in teslawbc/control.h and is
# unit-tested in tests/.
# =============================================================================

substitutions:
  device_name: teslawbc
  friendly_name: TeslaWBC

  # Bus 1, DRS-100 meter (UEXT UART pins of the Olimex board)
  meter_tx_pin: GPIO4
  meter_rx_pin: GPIO36
  meter_baud: "9600"
  meter_address: "1"

  # Bus 2, Wall Connector
  charger_tx_pin: GPIO32
  charger_rx_pin: GPIO33
  # Both reference projects run the charger bus at 115200. If the charger
  # never polls, try 9600 (see README, commissioning).
  charger_baud: "115200"

  # Relay for automatic recovery: drives the coil of a normally closed
  # contactor in the Wall Connector's feed (see README). GPIO13 stays low
  # during boot, so the contactor cannot twitch while the ESP32 starts.
  recovery_relay_pin: GPIO13
  recovery_power_off_s: "60"  # how long the Wall Connector is switched off

  # Fixed safety parameters
  pause_margin_a: "2.0"     # pause = report L + this
  meter_timeout_ms: "3000"  # no valid meter reading for this long = meter fault

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: r3stfu1.teslawbc
    version: "0.1.0"
  includes:
    - teslawbc/control.h

esp32:
  board: esp32-poe-iso
  flash_size: 16MB
  framework:
    type: esp-idf

# Olimex ESP32-POE-ISO wired network (LAN8720)
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_OUT
    pin: GPIO17
  phy_addr: 0
  power_pin:
    number: GPIO12
    ignore_strapping_warning: true  # PHY power switch on the Olimex board

logger:
  level: INFO

# The network address comes from DHCP. Reserve it in your router.

# Interface to Aperta. Every entity below gets a state topic
# <prefix>/<type>/<name>/state; controls also get <prefix>/<type>/<name>/command.
# Broker, port and login are set on the web page (setup wizard) and stored on
# the device; the values here are placeholders until then.
mqtt:
  broker: "0.0.0.0"
  enable_on_boot: false       # teslawbc_web enables it once a broker is set
  topic_prefix: ${device_name}
  discovery: false            # no Home Assistant discovery messages
  # <prefix>/status is "online" while connected, "offline" (last will) when not.
  # Never reboot because the broker is away: the fallback target handles that.
  reboot_timeout: 0s

# Web page (Status, Settings, Setup wizard) on http://<ip>/ and the REST API
# under /api/, protected by the device password. See README.md.
external_components:
  - source:
      type: local
      path: components

teslawbc_web:
  id: web
  mode: mode_select
  target: target_current
  heartbeat: heartbeat_button
  settings:
    - conductor_limit
    - max_output_current
    - min_current
    - fallback_target
    - fallback_timeout
    - ramp_rate
    - recovery_bypass_time
  switches:
    - auto_recovery
  sensors:
    - meter_v1
    - meter_v2
    - meter_v3
    - meter_i1
    - meter_i2
    - meter_i3
    - meter_p1
    - meter_p2
    - meter_p3
    - meter_total_power
    - meter_frequency
    - meter_import_energy
    - reported_current_sensor
    - effective_target_sensor
    - poll_interval_sensor
    - uptime_sensor
    - twc_vehicle_current
    - twc_session_energy
    - twc_session_time
    - twc_evse_state
  binary_sensors:
    - meter_ok_sensor
    - charger_polling_sensor
    - fallback_active_sensor
    - control_lost_sensor
    - twc_vehicle_connected
    - twc_contactor_closed
    - twc_reachable_sensor
    - recovery_active_sensor
    - wc_power_cut_sensor
  text_sensors:
    - state_text
    - last_incident_text
    - firmware_text
    - ip_address_text

ota:
  - platform: esphome
    encryption:
      key: !secret ota_encryption_key

# =============================================================================
# State shared between the meter, the control logic and the Neurio emulation.
# The Modbus server lambdas only return these values: the reply to the
# charger has to leave quickly, so nothing is computed there.
# =============================================================================
globals:
  - id: meter_seen
    type: bool
    initial_value: "false"
  - id: last_meter_ms
    type: uint32_t
    initial_value: "0"
  # Last command or heartbeat from Aperta
  - id: last_cmd_ms
    restore_value: no
    type: uint32_t
    initial_value: "0"
  # Reported current R on CT1 to CT3. Boots at "pause" until the meter answers.
  - id: reported_a
    type: float
    initial_value: "20.0"
  - id: reported_w
    type: float
    initial_value: "0.0"
  - id: effective_target_a
    type: float
    initial_value: "NAN"
  - id: ctl_state
    type: uint8_t
    initial_value: "5"  # METER_FAULT
  - id: ctl_meter_ok
    type: bool
    initial_value: "false"
  - id: ctl_fallback
    type: bool
    initial_value: "false"
  # Charger polling diagnostics
  - id: last_poll_ms
    type: uint32_t
    initial_value: "0"
  - id: poll_interval_ms
    type: float
    initial_value: "NAN"
  # Control Lost alarm
  - id: ctl_lost
    type: bool
    initial_value: "false"
  # Recovery
  - id: recovery_active
    type: bool
    initial_value: "false"
  - id: wc_power_cut
    type: bool
    initial_value: "false"
  # Wall Connector vitals
  - id: last_vitals_ms
    type: uint32_t
    initial_value: "0"

script:
  - id: recompute
    mode: single
    then:
      - lambda: |-
          teslawbc::Settings cfg;
          cfg.conductor_limit = id(conductor_limit).state;
          cfg.max_output = id(max_output_current).state;
          cfg.min_current = id(min_current).state;
          cfg.pause_margin = ${pause_margin_a};
          cfg.fallback_target = id(fallback_target).state;
          cfg.fallback_timeout_ms = (uint32_t) (id(fallback_timeout).state * 60000.0f);
          cfg.meter_timeout_ms = ${meter_timeout_ms};

          teslawbc::Inputs in;
          in.now_ms = millis();
          in.meter_seen = id(meter_seen);
          in.last_meter_ms = id(last_meter_ms);
          // Raw (unfiltered) values: control must follow the car without delay.
          in.current[0] = id(meter_i1).get_raw_state();
          in.current[1] = id(meter_i2).get_raw_state();
          in.current[2] = id(meter_i3).get_raw_state();
          auto idx = id(mode_select).active_index();
          in.mode = static_cast<teslawbc::Mode>(idx.has_value() ? idx.value() : 0);
          // Until the setup wizard is finished, TeslaWBC does not steer.
          if (!id(web).setup_done()) in.mode = teslawbc::Mode::BYPASS;
          // During a recovery the Wall Connector gets the honest current.
          if (id(web).recovery_forces_bypass()) in.mode = teslawbc::Mode::BYPASS;
          in.target = id(target_current).state;
          in.last_cmd_ms = id(last_cmd_ms);

          teslawbc::Result r = teslawbc::compute(cfg, in);

          // Ramp target changes and dither, so the charger sees a live,
          // smooth signal and never distrusts the meter.
          teslawbc::ShapeSettings ss;
          ss.ramp_rate = id(ramp_rate).state;
          static teslawbc::Shaper shaper;
          r.reported = shaper.update(ss, in.now_ms, r);

          // Power per CT for the Neurio power registers: R times phase voltage.
          float v[3] = {id(meter_v1).get_raw_state(), id(meter_v2).get_raw_state(),
                        id(meter_v3).get_raw_state()};
          float p = 0.0f;
          for (float vi : v) p += r.reported * ((std::isnan(vi) || vi < 100.0f) ? 230.0f : vi);

          id(reported_a) = r.reported;
          id(reported_w) = p / 3.0f;
          id(effective_target_a) = r.effective_target;
          id(ctl_meter_ok) = r.meter_ok;
          id(ctl_fallback) = r.fallback;
          // Lives here, not in globals: globals are declared before includes.
          static teslawbc::ControlWatch control_watch;
          bool lost = control_watch.update(teslawbc::WatchSettings{}, in.now_ms, r);
          if (lost != id(ctl_lost)) {
            id(ctl_lost) = lost;
            if (lost) {
              ESP_LOGW("teslawbc", "Control lost: car draws %.1f A in state %s", r.max_current,
                       teslawbc::state_name(r.state));
            } else {
              ESP_LOGI("teslawbc", "Control restored");
            }
          }

          // Automatic recovery: cut the Wall Connector's power, then Bypass.
          teslawbc::RecoverySettings rs;
          rs.auto_enabled = id(auto_recovery).state;
          rs.power_off_ms = ${recovery_power_off_s} * 1000u;
          rs.bypass_ms = (uint32_t) (id(recovery_bypass_time).state * 60000.0f);
          bool rec_started = false;
          bool cut = id(web).update_recovery(rs, in.now_ms, lost, &rec_started);
          if (cut != id(wc_power_cut)) {
            id(wc_power_cut) = cut;
            if (cut) {
              id(wc_power_relay).turn_on();
            } else {
              id(wc_power_relay).turn_off();
            }
          }
          id(recovery_active) = id(web).recovery_active();

          // Incident recorder: one sample per second, frozen on the alarm.
          static bool prev_lost = false;
          bool rising = lost && !prev_lost;
          prev_lost = lost;
          teslawbc::Sample smp;
          smp.t_ms = in.now_ms;
          for (int k = 0; k < 3; k++) smp.w[k] = teslawbc::Sample::ca(in.current[k]);
          smp.reported = teslawbc::Sample::ca(r.reported);
          smp.target = teslawbc::Sample::ca(r.effective_target);
          bool vitals = id(last_vitals_ms) != 0 && (millis() - id(last_vitals_ms)) < 30000;
          smp.vehicle = vitals ? teslawbc::Sample::ca(id(twc_vehicle_current).state) : teslawbc::Sample::NO_VALUE;
          float poll = id(poll_interval_ms);
          smp.poll_ms = std::isnan(poll) ? 0 : (uint16_t) std::min(poll, 65535.0f);
          smp.mode = static_cast<uint8_t>(in.mode);
          smp.state = static_cast<uint8_t>(r.state);
          smp.flags = (r.meter_ok ? teslawbc::Sample::FLAG_METER_OK : 0) |
                      (id(charger_polling_sensor).state ? teslawbc::Sample::FLAG_POLLING : 0) |
                      (lost ? teslawbc::Sample::FLAG_LOST : 0) |
                      (id(recovery_active) ? teslawbc::Sample::FLAG_RECOVERY : 0);
          teslawbc::AnalysisSettings as;
          as.ramp_rate = ss.ramp_rate;
          auto now_time = id(sntp_time).now();
          uint32_t epoch = now_time.is_valid() ? (uint32_t) now_time.timestamp : 0;
          if (id(web).record(smp, rising, epoch, as))
            id(last_incident_text).publish_state(id(web).last_incident_summary());

          if (static_cast<uint8_t>(r.state) != id(ctl_state)) {
            id(ctl_state) = static_cast<uint8_t>(r.state);
            ESP_LOGI("teslawbc", "State: %s, reported %.2f A", teslawbc::state_name(r.state), r.reported);
            id(state_text).publish_state(teslawbc::state_name(r.state));
          }

interval:
  # Timeouts (meter, Aperta) also need checking when no reading arrives.
  - interval: 250ms
    then:
      - script.execute: recompute
  # Wall Connector vitals, for status only. Address set on the web page.
  - interval: 10s
    then:
      - if:
          condition:
            lambda: return !id(web).wc_host().empty();
          then:
            - http_request.get:
                url: !lambda return "http://" + id(web).wc_host() + "/api/1/vitals";
                capture_response: true
                max_response_buffer_size: 2kB
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) return;
                        json::parse_json(body, [](JsonObject root) -> bool {
                          id(last_vitals_ms) = millis();
                          id(twc_vehicle_connected).publish_state(root["vehicle_connected"] | false);
                          id(twc_contactor_closed).publish_state(root["contactor_closed"] | false);
                          id(twc_vehicle_current).publish_state(root["vehicle_current_a"] | NAN);
                          id(twc_session_energy).publish_state((root["session_energy_wh"] | NAN) / 1000.0f);
                          id(twc_session_time).publish_state(root["session_s"] | NAN);
                          id(twc_evse_state).publish_state(root["evse_state"] | NAN);
                          return true;
                        });

http_request:
  timeout: 3s

# =============================================================================
# Bus 1: Crompton DRS-100-3P MOD (Modbus master)
# =============================================================================
uart:
  - id: uart_meter
    tx_pin: ${meter_tx_pin}
    rx_pin: ${meter_rx_pin}
    baud_rate: ${meter_baud}
    data_bits: 8
    parity: NONE
    stop_bits: 1
  - id: uart_charger
    tx_pin: ${charger_tx_pin}
    rx_pin: ${charger_rx_pin}
    baud_rate: ${charger_baud}
    data_bits: 8
    parity: NONE
    stop_bits: 1

modbus:
  - id: bus_meter
    uart_id: uart_meter
    role: client
    send_wait_time: 500ms  # DRS-100 comms guide: 500 ms response timeout
  - id: bus_charger
    uart_id: uart_charger
    role: server

modbus_controller:
  # Fast: voltages, currents and powers of all phases in one request
  # (function code 04, 0x0000, 18 registers).
  - id: meter_fast
    modbus_id: bus_meter
    address: ${meter_address}
    update_interval: 300ms
    max_cmd_retries: 0
  # Slow: totals for Aperta only.
  - id: meter_slow
    modbus_id: bus_meter
    address: ${meter_address}
    update_interval: 10s
    max_cmd_retries: 1

sensor:
  # --- Meter, fast block. Filters only affect what Aperta sees;
  #     the control logic reads the raw values. ---
  - platform: modbus_controller
    modbus_controller_id: meter_fast
    id: meter_v1
    name: "Voltage L1"
    register_type: read
    address: 0x00
    value_type: FP32
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters: [throttle_average: 10s]
  - platform: modbus_controller
    modbus_controller_id: meter_fast
    id: meter_v2
    name: "Voltage L2"
    register_type: read
    address: 0x02
    value_type: FP32
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters: [throttle_average: 10s]
  - platform: modbus_controller
    modbus_controller_id: meter_fast
    id: meter_v3
    name: "Voltage L3"
    register_type: read
    address: 0x04
    value_type: FP32
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters: [throttle_average: 10s]
  - platform: modbus_controller
    modbus_controller_id: meter_fast
    id: meter_i1
    name: "Current L1"
    register_type: read
    address: 0x06
    value_type: FP32
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters: [throttle_average: 5s]
  - platform: modbus_controller
    modbus_controller_id: meter_fast
    id: meter_i2
    name: "Current L2"
    register_type: read
    address: 0x08
    value_type: FP32
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters: [throttle_average: 5s]
  - platform: modbus_controller
    modbus_controller_id: meter_fast
    id: meter_i3
    name: "Current L3"
    register_type: read
    address: 0x0A
    value_type: FP32
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters: [throttle_average: 5s]
  - platform: modbus_controller
    modbus_controller_id: meter_fast
    id: meter_p1
    name: "Power L1"
    register_type: read
    address: 0x0C
    value_type: FP32
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters: [throttle_average: 5s]
  - platform: modbus_controller
    modbus_controller_id: meter_fast
    id: meter_p2
    name: "Power L2"
    register_type: read
    address: 0x0E
    value_type: FP32
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters: [throttle_average: 5s]
  # Last register of the block: its raw value marks a complete, fresh reading.
  - platform: modbus_controller
    modbus_controller_id: meter_fast
    id: meter_p3
    name: "Power L3"
    register_type: read
    address: 0x10
    value_type: FP32
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters: [throttle_average: 5s]
    on_raw_value:
      then:
        - lambda: |-
            id(meter_seen) = true;
            id(last_meter_ms) = millis();
        - script.execute: recompute

  # --- Meter, slow block ---
  - platform: modbus_controller
    modbus_controller_id: meter_slow
    id: meter_total_power
    name: "Power"
    register_type: read
    address: 0x34
    value_type: FP32
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: meter_slow
    id: meter_frequency
    name: "Frequency"
    register_type: read
    address: 0x46
    value_type: FP32
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
  - platform: modbus_controller
    modbus_controller_id: meter_slow
    id: meter_import_energy
    name: "Energy"
    register_type: read
    address: 0x48
    value_type: FP32
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2

  # --- Controller ---
  - platform: template
    id: reported_current_sensor
    name: "Reported Current"
    icon: mdi:current-ac
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    lambda: return id(reported_a);
  - platform: template
    id: effective_target_sensor
    name: "Effective Target"
    icon: mdi:target
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(effective_target_a);
  - platform: template
    id: poll_interval_sensor
    name: "Charger Poll Interval"
    icon: mdi:timer-outline
    unit_of_measurement: ms
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 10s
    lambda: return id(poll_interval_ms);
  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    entity_category: diagnostic

  # --- Wall Connector vitals (local API, status only) ---
  - platform: template
    id: twc_vehicle_current
    name: "WC Vehicle Current"
    icon: mdi:car-electric
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: twc_session_energy
    name: "WC Session Energy"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: twc_session_time
    name: "WC Session Time"
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: twc_evse_state
    name: "WC EVSE State"
    icon: mdi:ev-station
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

binary_sensor:
  - platform: template
    id: meter_ok_sensor
    name: "Meter OK"
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(ctl_meter_ok);
  - platform: template
    id: charger_polling_sensor
    name: "Charger Polling"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_poll_ms) != 0 && (millis() - id(last_poll_ms)) < 2000;
  - platform: template
    id: fallback_active_sensor
    name: "Fallback Active"
    device_class: problem
    lambda: return id(ctl_fallback);
  # The charger is not following TeslaWBC: the car draws clearly more than
  # the target, or keeps charging in a pause, for 3 minutes.
  - platform: template
    id: control_lost_sensor
    name: "Control Lost"
    device_class: problem
    lambda: return id(ctl_lost);
  - platform: template
    id: twc_vehicle_connected
    name: "WC Vehicle Connected"
    device_class: plug
  - platform: template
    id: twc_contactor_closed
    name: "WC Contactor Closed"
    device_class: power
  - platform: template
    id: twc_reachable_sensor
    name: "WC Reachable"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_vitals_ms) != 0 && (millis() - id(last_vitals_ms)) < 30000;
  - platform: template
    id: recovery_active_sensor
    name: "Recovery Active"
    icon: mdi:restart-alert
    lambda: return id(recovery_active);
  - platform: template
    id: wc_power_cut_sensor
    name: "WC Power Cut"
    icon: mdi:power-plug-off
    lambda: return id(wc_power_cut);
  - platform: status
    name: "Status"
  # Factory reset: hold the board's user button (BUT1) for 10 seconds.
  - platform: gpio
    id: user_button
    pin:
      number: GPIO34
      inverted: true
    internal: true
    filters:
      - delayed_on: 10s
    on_press:
      - lambda: id(web).factory_reset();
      - delay: 1s
      - lambda: App.safe_reboot();

text_sensor:
  - platform: template
    id: state_text
    name: "State"
    icon: mdi:ev-station
    update_interval: never
  - platform: version
    id: firmware_text
    name: "Firmware"
    entity_category: diagnostic
  # Short result of the last Control Lost incident; the full recording is
  # at /api/incidents and on MQTT topic teslawbc/incident.
  - platform: template
    id: last_incident_text
    name: "Last Incident"
    icon: mdi:file-alert-outline
    update_interval: never
  - platform: ethernet_info
    ip_address:
      id: ip_address_text
      name: "IP Address"
      entity_category: diagnostic

# =============================================================================
# Controls set by Aperta
# =============================================================================
select:
  - platform: template
    id: mode_select
    name: "Mode"
    icon: mdi:ev-plug-type2
    # Order matters: index 0, 1, 2 = teslawbc::Mode BYPASS, MANUAL, PAUSE.
    options: [Bypass, Manual, Pause]
    initial_option: Bypass
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(last_cmd_ms) = millis();
      - script.execute: recompute

number:
  # Not restored on purpose: Aperta may write it often, and flash should
  # not wear out. After a reboot it starts at 6 A until Aperta writes it.
  - platform: template
    id: target_current
    name: "Target Current"
    icon: mdi:current-ac
    unit_of_measurement: A
    device_class: current
    mode: box
    min_value: 0
    max_value: 32
    step: 1
    initial_value: 6
    optimistic: true
    on_value:
      - lambda: id(last_cmd_ms) = millis();
      - script.execute: recompute
  # Must equal "Max Conductor Limit" set in the Tesla app.
  - platform: template
    id: conductor_limit
    name: "Max Conductor Limit"
    icon: mdi:cable-data
    entity_category: config
    unit_of_measurement: A
    device_class: current
    mode: box
    min_value: 6
    max_value: 48
    step: 0.5
    initial_value: 18
    optimistic: true
    restore_value: true
  # Must equal "Max Output Current" set in the Tesla app.
  - platform: template
    id: max_output_current
    name: "Max Output Current"
    icon: mdi:ev-station
    entity_category: config
    unit_of_measurement: A
    device_class: current
    mode: box
    min_value: 6
    max_value: 48
    step: 1
    initial_value: 16
    optimistic: true
    restore_value: true
  # Lowest target that still charges; below it TeslaWBC pauses. The Wall
  # Connector's pilot signal (IEC 61851) starts at 6 A, so 5 A only holds if
  # the car accepts it. Lower it only after testing (see README).
  - platform: template
    id: min_current
    name: "Min Current"
    icon: mdi:current-ac
    entity_category: config
    unit_of_measurement: A
    device_class: current
    mode: box
    min_value: 5
    max_value: 16
    step: 1
    initial_value: 6
    optimistic: true
    restore_value: true
  # Used when Aperta is silent. Below 6 A means pause.
  - platform: template
    id: fallback_target
    name: "Fallback Target"
    icon: mdi:shield-car
    entity_category: config
    unit_of_measurement: A
    device_class: current
    mode: box
    min_value: 0
    max_value: 32
    step: 1
    initial_value: 6
    optimistic: true
    restore_value: true
  - platform: template
    id: fallback_timeout
    name: "Fallback Timeout"
    icon: mdi:timer-alert-outline
    entity_category: config
    unit_of_measurement: min
    mode: box
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
  # How fast TeslaWBC moves the charger to a new target, a pause or Bypass.
  # The car's own current always passes through at once.
  - platform: template
    id: ramp_rate
    name: "Ramp Rate"
    icon: mdi:chart-line-variant
    entity_category: config
    unit_of_measurement: A/s
    mode: box
    min_value: 0.05
    max_value: 2
    step: 0.05
    initial_value: 0.25
    optimistic: true
    restore_value: true
  # How long TeslaWBC stays in Bypass after cutting the Wall Connector's power.
  - platform: template
    id: recovery_bypass_time
    name: "Recovery Bypass Time"
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: min
    mode: box
    min_value: 30
    max_value: 480
    step: 10
    initial_value: 120
    optimistic: true
    restore_value: true

switch:
  # Off by default: switch on once the contactor is installed.
  - platform: template
    id: auto_recovery
    name: "Auto Recovery"
    icon: mdi:restart-alert
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

output:
  # Energized = contactor coil on = Wall Connector OFF (normally closed).
  - platform: gpio
    id: wc_power_relay
    pin: ${recovery_relay_pin}

time:
  - platform: sntp
    id: sntp_time

button:
  # Aperta presses this (or writes Mode or Target Current) at least once per
  # Fallback Timeout to show it is alive.
  - platform: template
    id: heartbeat_button
    name: "Heartbeat"
    icon: mdi:heart-pulse
    on_press:
      - lambda: id(last_cmd_ms) = millis();
  # Start a recovery by hand: power off for 1 min, then Bypass.
  - platform: template
    id: recover_button
    name: "Recover Wall Connector"
    icon: mdi:restart-alert
    on_press:
      - lambda: id(web).start_recovery();
  - platform: template
    id: cancel_recovery_button
    name: "Cancel Recovery"
    icon: mdi:cancel
    on_press:
      - lambda: id(web).cancel_recovery();
  - platform: restart
    name: "Restart"
    entity_category: config

# =============================================================================
# Bus 2: Neurio meter emulation (Modbus server, address 1)
# The Wall Connector polls about every 190 ms. Register map from the
# community reverse engineering (LucaTNT gist), identical to
# PVi1/esphome-twc-control and zany92/tesla-loadpilot.
# =============================================================================
modbus_server:
  - modbus_id: bus_charger
    address: 1
    registers:
      # --- Identification block (fixed) ---
      # Serial "0x000471 4B056861"
      - { address: 1, value_type: U_WORD, read_lambda: "return 0x3078;" }
      - { address: 2, value_type: U_WORD, read_lambda: "return 0x3030;" }
      - { address: 3, value_type: U_WORD, read_lambda: "return 0x3030;" }
      - { address: 4, value_type: U_WORD, read_lambda: "return 0x3034;" }
      - { address: 5, value_type: U_WORD, read_lambda: "return 0x3731;" }
      - { address: 6, value_type: U_WORD, read_lambda: "return 0x3442;" }
      - { address: 7, value_type: U_WORD, read_lambda: "return 0x3035;" }
      - { address: 8, value_type: U_WORD, read_lambda: "return 0x3638;" }
      - { address: 9, value_type: U_WORD, read_lambda: "return 0x3631;" }
      - { address: 10, value_type: U_WORD, read_lambda: "return 0x0000;" }
      # Firmware "1.6.1-Tesla"
      - { address: 11, value_type: U_WORD, read_lambda: "return 0x312E;" }
      - { address: 12, value_type: U_WORD, read_lambda: "return 0x362E;" }
      - { address: 13, value_type: U_WORD, read_lambda: "return 0x312D;" }
      - { address: 14, value_type: U_WORD, read_lambda: "return 0x5465;" }
      - { address: 15, value_type: U_WORD, read_lambda: "return 0x736C;" }
      - { address: 16, value_type: U_WORD, read_lambda: "return 0x6100;" }
      - { address: 17, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 18, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 19, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 20, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      # Model "012.00020A.H"
      - { address: 21, value_type: U_WORD, read_lambda: "return 0x3031;" }
      - { address: 22, value_type: U_WORD, read_lambda: "return 0x322E;" }
      - { address: 23, value_type: U_WORD, read_lambda: "return 0x3030;" }
      - { address: 24, value_type: U_WORD, read_lambda: "return 0x3032;" }
      - { address: 25, value_type: U_WORD, read_lambda: "return 0x3041;" }
      - { address: 26, value_type: U_WORD, read_lambda: "return 0x2E48;" }
      - { address: 27, value_type: U_WORD, read_lambda: "return 0x0000;" }
      - { address: 28, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      # Meter number "90954"
      - { address: 29, value_type: U_WORD, read_lambda: "return 0x3930;" }
      - { address: 30, value_type: U_WORD, read_lambda: "return 0x3935;" }
      - { address: 31, value_type: U_WORD, read_lambda: "return 0x3400;" }
      # Model "VAH4810AB0231"
      - { address: 32, value_type: U_WORD, read_lambda: "return 0x5641;" }
      - { address: 33, value_type: U_WORD, read_lambda: "return 0x4834;" }
      - { address: 34, value_type: U_WORD, read_lambda: "return 0x3831;" }
      - { address: 35, value_type: U_WORD, read_lambda: "return 0x3041;" }
      - { address: 36, value_type: U_WORD, read_lambda: "return 0x4230;" }
      - { address: 37, value_type: U_WORD, read_lambda: "return 0x3233;" }
      - { address: 38, value_type: U_WORD, read_lambda: "return 0x3100;" }
      - { address: 39, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 40, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 41, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 42, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 43, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 44, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 45, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      - { address: 46, value_type: U_WORD, read_lambda: "return 0xFFFF;" }
      # MAC "04:71:4B:05:68:61"
      - { address: 47, value_type: U_WORD, read_lambda: "return 0x3034;" }
      - { address: 48, value_type: U_WORD, read_lambda: "return 0x3A37;" }
      - { address: 49, value_type: U_WORD, read_lambda: "return 0x313A;" }
      - { address: 50, value_type: U_WORD, read_lambda: "return 0x3442;" }
      - { address: 51, value_type: U_WORD, read_lambda: "return 0x3A30;" }
      - { address: 52, value_type: U_WORD, read_lambda: "return 0x353A;" }
      - { address: 53, value_type: U_WORD, read_lambda: "return 0x3638;" }
      - { address: 54, value_type: U_WORD, read_lambda: "return 0x3A36;" }
      - { address: 55, value_type: U_WORD, read_lambda: "return 0x3100;" }

      # --- Power per CT in W (R times phase voltage), CT4 unused ---
      - { address: 0x88, value_type: FP32, read_lambda: "return id(reported_w);" }
      - { address: 0x8A, value_type: FP32, read_lambda: "return id(reported_w);" }
      - { address: 0x8C, value_type: FP32, read_lambda: "return id(reported_w);" }
      - { address: 0x8E, value_type: FP32, read_lambda: "return 0.0f;" }
      - { address: 0x90, value_type: FP32, read_lambda: "return 3.0f * id(reported_w);" }
      - { address: 0x92, value_type: U_WORD, read_lambda: "return 0;" }

      # --- Current per CT in A: this is what the charger regulates on ---
      # Reading CT1 marks one poll cycle for the diagnostics.
      - address: 0xF4
        value_type: FP32
        read_lambda: |-
          uint32_t now = millis();
          if (id(last_poll_ms) != 0) id(poll_interval_ms) = (float) (now - id(last_poll_ms));
          id(last_poll_ms) = now;
          return id(reported_a);
      - { address: 0xF6, value_type: FP32, read_lambda: "return id(reported_a);" }
      - { address: 0xF8, value_type: FP32, read_lambda: "return id(reported_a);" }
      - { address: 0xFA, value_type: FP32, read_lambda: "return 0.0f;" }
      - { address: 0xFC, value_type: FP32, read_lambda: "return 3.0f * id(reported_a);" }

      # --- Handshake block ("Generac") ---
      - { address: 40002, value_type: U_WORD, read_lambda: "return 0x0001;" }
      - { address: 40003, value_type: U_WORD, read_lambda: "return 0x0042;" }
      - { address: 40004, value_type: U_WORD, read_lambda: "return 0x4765;" }
      - { address: 40005, value_type: U_WORD, read_lambda: "return 0x6E65;" }
      - { address: 40006, value_type: U_WORD, read_lambda: "return 0x7261;" }
      - { address: 40007, value_type: U_WORD, read_lambda: "return 0x6300;" }
